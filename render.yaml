services:
  - type: web
    name: packcheck-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: packcheck-ai-service
          property: host

  - type: web
    name: packcheck-ai-service
    env: docker
    rootDir: ai-service
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: UVICORN_WORKERS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: ONNXRUNTIME_NUM_THREADS
        value: "1"
