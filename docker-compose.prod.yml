version: '3.8'

services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: packcheck-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=legal-metrology-checker
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: packcheck-ai:2.2.0-prod
    container_name: packcheck-ai-service-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OMP_NUM_THREADS=2
      - ONNXRUNTIME_NUM_THREADS=2
      - BACKEND_ORIGIN=http://backend:5000
    volumes:
      - ai_sessions:/app/processed_data/sessions
      - ai_reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: packcheck-backend:2.2.0-prod
    container_name: packcheck-backend-gateway-prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/legal-metrology-checker
      - JWT_SECRET=packcheck_prod_jwt_secret_key_2026_sih
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_ORIGIN=http://localhost
      - UPLOAD_DIR=./uploads
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: packcheck-frontend:2.2.0-prod
    container_name: packcheck-frontend-ui-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
    driver: local
  ai_sessions:
    driver: local
  ai_reports:
    driver: local
  backend_uploads:
    driver: local
